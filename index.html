<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Troop 189 Scout Activity Tracker</title>

  <!-- Link-preview tags for texts, WhatsApp, iMessage, etc. - deliberately placed on THIS
       static page rather than the Apps Script app itself. Apps Script's cold-start response
       time can exceed the ~3 second window these crawlers give a page before giving up
       entirely - a static page like this one responds instantly, sidestepping that risk
       completely. Same logo already confirmed correct. -->
  <meta property="og:title" content="Troop 189 Scout Activity Tracker">
  <meta property="og:description" content="Track your progress toward Scouting awards and merit badges.">
  <meta property="og:image" content="https://i.imgur.com/yCLvKsB.png">
  <meta property="og:image:width" content="512">
  <meta property="og:image:height" content="512">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://scoutactivitytracker.com/">

  <!-- This is the real, working home-screen icon setup - since THIS page (not the Apps
       Script app itself) is what a Scout actually navigates to and adds to their home
       screen once this is live on a real domain, these tags are what iOS/Android will
       actually read - no Apps-Script-serving-quirk in the way this time. -->
  <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/brucewaine1940-jpg/Troop189-assets/main/Troop189_logo_for_app.png">
  <link rel="icon" type="image/png" sizes="180x180" href="https://raw.githubusercontent.com/brucewaine1940-jpg/Troop189-assets/main/Troop189_logo_for_app.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Troop 189 Tracker">
  <meta name="theme-color" content="#F5F5F7">

  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
    iframe { display: block; width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>
  <!--
    REPLACE THE SRC BELOW with your actual Apps Script /exec URL before testing.
    This is the one placeholder in this whole file - everything else is ready to go.
  -->
  <iframe src="https://script.google.com/macros/s/AKfycbz0MZ2xuh-OMIIEQDaZF3FDRRhqn1SUCq1WrbuzUI9q-I5ywMKPVjy53y7OxmItKcWVlg/exec" allow="autoplay"></iframe>
</body>
</html>
